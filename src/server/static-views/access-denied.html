<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied - Toucotop Overlay</title>
  <link rel="stylesheet" href="server-pages.css">
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code access-denied">🚫</div>
    <h1 class="error-title">Access Denied</h1>
    <p class="error-message">
      You are not authorized to use this overlay system.
    </p>
    <div class="user-info">{{USERNAME}}</div>
    
    <div class="details-section">
      <h3>This overlay system is restricted to:</h3>
      <p>Only authorized streamers can use this overlay system. If you believe you should have access, please contact the stream admin to be added to the allowed users list.</p>
    </div>
  </div>
</body>
</html>
