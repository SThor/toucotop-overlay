<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafafa;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.6;
    }
    
    .container {
      text-align: center;
      max-width: 400px;
      padding: 2rem;
    }
    
    .error-code {
      font-size: 6rem;
      font-weight: 300;
      color: #999;
      margin-bottom: 1rem;
    }
    
    .error-title {
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 1rem;
      color: #555;
    }
    
    .error-message {
      font-size: 1rem;
      color: #777;
      margin-bottom: 2rem;
    }
    
    .path-info {
      font-family: 'Courier New', monospace;
      background: #f5f5f5;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #666;
      border-left: 3px solid #ddd;
      word-break: break-all;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1a1a1a;
        color: #e0e0e0;
      }
      
      .error-code {
        color: #666;
      }
      
      .error-title {
        color: #ccc;
      }
      
      .error-message {
        color: #999;
      }
      
      .path-info {
        background: #2a2a2a;
        color: #aaa;
        border-left-color: #444;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page not found</h1>
    <p class="error-message">
      The page you're looking for doesn't exist.
    </p>
    <div class="path-info">{{REQUEST_PATH}}</div>
  </div>
</body>
</html>
