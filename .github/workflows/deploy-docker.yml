name: Deploy Overlay

on:
  push:
    branches: [ docker-migration ]
  workflow_dispatch:

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/sthor/toucotop-overlay:staging
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to Staging
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: github-deploy
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # Update staging service in global docker-compose
          cd /opt/infra-docs
          
          # Pull new image and restart service
          docker compose pull toucotop-overlay-staging
          docker compose up -d toucotop-overlay-staging
          
          # Verify deployment
          sleep 10
          docker compose ps toucotop-overlay-staging
          curl -f http://localhost:3000/health || echo "⚠️ Staging health check failed"
          echo "🚀 Deployed staging to port 3000"