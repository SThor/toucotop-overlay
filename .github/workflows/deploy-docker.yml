name: Deploy Overlay

on:
  push:
    branches: [ docker-migration, oauth-integration ]
  workflow_dispatch:

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/sthor/toucotop-overlay:staging
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to Staging
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: github-deploy
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # Debug permissions
          echo "🔍 Current user: $(whoami)"
          echo "🔍 User groups: $(groups)"
          echo "🔍 Home directory: $HOME"
          
          # Check directory permissions
          echo "🔍 Checking /home permissions:"
          ls -la /home/ || echo "Cannot access /home"
          
          echo "🔍 Checking /home/ubuntu permissions:"
          ls -la /home/ubuntu/ || echo "Cannot access /home/ubuntu"
          
          # Try to access the target directory
          if [ -d "/home/ubuntu/infra-docs" ]; then
            echo "✅ Directory exists"
            echo "🔍 Directory permissions:"
            ls -la /home/ubuntu/ | grep infra-docs || echo "Cannot see infra-docs details"
          else
            echo "❌ Directory /home/ubuntu/infra-docs does not exist"
          fi
          
          # Try to change directory with more explicit error handling
          echo "🔍 Attempting to change to infra-docs directory..."
          cd /home/ubuntu/infra-docs || {
            echo "❌ Failed to cd to /home/ubuntu/infra-docs"
            echo "🔍 Creating alternative approach..."
            # Create the .env file using absolute path instead
            echo "TWITCH_CLIENT_ID=${{ secrets.TWITCH_CLIENT_ID }}" > /home/ubuntu/infra-docs/.env
            echo "TWITCH_CLIENT_SECRET=${{ secrets.TWITCH_CLIENT_SECRET }}" >> /home/ubuntu/infra-docs/.env
            echo "✅ OAuth environment configured via absolute path"
            # Use absolute paths for docker compose commands
            docker compose -f /home/ubuntu/infra-docs/docker-compose.yml down toucotop-overlay-staging || echo "Container wasn't running"
            docker compose -f /home/ubuntu/infra-docs/docker-compose.yml pull toucotop-overlay-staging
            docker compose -f /home/ubuntu/infra-docs/docker-compose.yml up -d toucotop-overlay-staging
            # Skip to verification section
            sleep 15
            echo "📊 Container status:"
            docker compose -f /home/ubuntu/infra-docs/docker-compose.yml ps toucotop-overlay-staging
            echo "🔍 Container logs (last 20 lines):"
            docker compose -f /home/ubuntu/infra-docs/docker-compose.yml logs --tail=20 toucotop-overlay-staging
            # Health checks
            echo "🔍 Testing endpoints..."
            curl -f http://localhost:3000/health && echo "✅ Health check passed" || echo "⚠️ Health check failed"
            curl -f http://localhost:3000/auth/status && echo "✅ OAuth endpoints responding" || echo "⚠️ OAuth endpoints not responding"
            echo "🚀 Deployed staging to port 3000 with OAuth support"
            exit 0
          }
          
          # If we successfully cd'ed, continue with the original approach
          # Create/update .env file for docker-compose with OAuth secrets
          cat > .env << EOF
          TWITCH_CLIENT_ID=${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET=${{ secrets.TWITCH_CLIENT_SECRET }}
          EOF
          
          echo "✅ OAuth environment configured (persistent .env file)"
          
          # Stop old container first to ensure fresh start
          docker compose down toucotop-overlay-staging || echo "Container wasn't running"
          
          # Pull new image and restart service
          docker compose pull toucotop-overlay-staging
          docker compose up -d toucotop-overlay-staging
          
          # Verify deployment
          sleep 15
          echo "📊 Container status:"
          docker compose ps toucotop-overlay-staging
          
          echo "🔍 Container logs (last 20 lines):"
          docker compose logs --tail=20 toucotop-overlay-staging
          
          # Health checks
          echo "🔍 Testing endpoints..."
          curl -f http://localhost:3000/health && echo "✅ Health check passed" || echo "⚠️ Health check failed"
          curl -f http://localhost:3000/auth/status && echo "✅ OAuth endpoints responding" || echo "⚠️ OAuth endpoints not responding"
          
          echo "🚀 Deployed staging to port 3000 with OAuth support"