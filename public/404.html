<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Connection Lost</title>
  <style>
    :root {
      --DarkRGBA: 31, 15, 1;
      --MainRGBA: 229, 109, 12;
      --LightRGBA: 255, 235, 219;
      --Dark: rgb(var(--DarkRGBA));
      --Main: rgb(var(--MainRGBA));
      --Light: rgb(var(--LightRGBA));
    }
    
    body {
      margin: 0;
      padding: 0;
      background: var(--Dark);
      color: var(--Light);
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(circle at 25% 25%, rgba(var(--MainRGBA), 0.1) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(var(--MainRGBA), 0.1) 0%, transparent 50%);
    }
    
    .error-container {
      text-align: center;
      padding: 2rem;
      border: 2px solid var(--Main);
      border-radius: 10px;
      background: rgba(var(--DarkRGBA), 0.9);
      box-shadow: 0 0 20px rgba(var(--MainRGBA), 0.3);
      max-width: 500px;
    }
    
    .error-code {
      font-size: 8rem;
      font-weight: bold;
      color: var(--Main);
      text-shadow: 0 0 10px rgba(var(--MainRGBA), 0.5);
      margin: 0;
      line-height: 1;
    }
    
    .error-title {
      font-size: 2rem;
      margin: 1rem 0;
      color: var(--Main);
    }
    
    .error-message {
      font-size: 1.2rem;
      margin: 1rem 0;
      line-height: 1.5;
    }
    
    .twitch-reference {
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.8;
      font-style: italic;
    }
    
    .path-info {
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(var(--MainRGBA), 0.1);
      border-radius: 5px;
      font-size: 0.9rem;
      word-break: break-all;
    }
    
    @keyframes glow {
      0%, 100% { text-shadow: 0 0 10px rgba(var(--MainRGBA), 0.5); }
      50% { text-shadow: 0 0 20px rgba(var(--MainRGBA), 0.8); }
    }
    
    .error-code {
      animation: glow 2s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <h1 class="error-code">404</h1>
    <h2 class="error-title">Connection Lost</h2>
    <p class="error-message">
      🎮 Looks like you tried to access a route that doesn't exist!<br>
      The overlay server couldn't find what you're looking for.
    </p>
    <div class="path-info">
      <strong>Requested path:</strong> {{REQUEST_PATH}}
    </div>
    <p class="twitch-reference">
      💜 "That's a big oof in chat..." - Twitch Chat, probably
    </p>
  </div>
</body>
</html>
